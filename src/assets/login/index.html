<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPB Panel v__VERSION__</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="data:image/x-icon;base64,__ICON__">
    <style>/* CSS_PLACEHOLDER */</style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img id="header-logo" src="data:image/x-icon;base64,__ICON__" alt="BPB Logo" width="48" height="48">
            <h1>
                BPB Panel
                <span class="panel-version">
                    v__VERSION__
                </span>
            </h1>
        </div>
        <div class="form-container">
            <h2>User Login</h2>
            <form id="loginForm" class="login-form">
                <div class="form-control">
                    <label for="username">Cloudflare Email</label>
                    <input type="text" id="username" class="input-wrapper" name="username" required>
                </div>
                <div class="form-control">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required>
                        <span id="togglePassword" class="material-symbols-rounded toggle-password">
                            visibility_off
                        </span>
                    </div>
                </div>
                <div id="passwordError" class="hint"></div>
                <button type="submit" class="button">
                    <span class="material-symbols-rounded">
                        login
                    </span>
                    Login
                </button>
            </form>
        </div>
    </div>
    <script>/* JS_PLACEHOLDER */</script>
</body>

</html>
